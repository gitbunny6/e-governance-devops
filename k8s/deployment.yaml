apiVersion: apps/v1
kind: Deployment
metadata:
  name: egov-app
  labels:
    app: egov-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: egov-app
  template:
    metadata:
      labels:
        app: egov-app
    spec:
      containers:
        - name: egov-app
          image: egov-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: egov-service
spec:
  type: NodePort
  selector:
    app: egov-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
